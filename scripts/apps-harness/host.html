const searchResult = {
  searchHits: bids.length,
  returnedCount: bids.length,
  bids,
  query: { Query: "システム", CFT_Issue_Date: "2026-07-01", Prefecture: "46" },
  attribution,
  pagination: { has_more: false, total_count: bids.length },
  searchCriteria: {
    query: "システム",
    prefecture: ["鹿児島県"],
    limit: 20,
    certification: ["役務の提供等 A・B等級"],
  },
};

const hostCapabilities = {
  openLinks: {},
  serverTools: { listChanged: false },
  serverResources: { listChanged: false },
  logging: {},
  updateModelContext: { text: {} },
  ...(denyMessage ? {} : { message: { text: {} } }),
  ...(denyDownload ? {} : { downloadFile: {} }),
};

const hostContext = {
  theme,
  displayMode,
  availableDisplayModes: ["inline", "fullscreen"],
  userAgent: "mcp-apps-harness/1.0",
  locale: "ja-JP",
};

const result = (id, value) => send({ jsonrpc: "2.0", id, result: value });
const errorResult = (id, message) =>
  send({ jsonrpc: "2.0", id, result: { isError: true, content: [{ type: "text", text: message }] } });

window.appRequests = [];

window.addEventListener("message", (event) => {
  const message = event.data;
  if (!message || message.jsonrpc !== "2.0") return;
  if (message.method) window.appRequests.push(message.method);

  switch (message.method) {
    case "ui/initialize":
      result(message.id, {
        protocolVersion: PROTOCOL_VERSION,
        hostInfo: { name: "mcp-apps-harness", version: "1.0.0" },
        hostCapabilities,
        hostContext,
      });
      return;
    case "ui/notifications/initialized":
      if (autoResult) {
        send({
          jsonrpc: "2.0",
          method: "ui/notifications/tool-input",
          params: { arguments: { query: "システム", limit: 20 } },
        });
        send({
          jsonrpc: "2.0",
          method: "ui/notifications/tool-result",
          params: {
            structuredContent: searchResult,
            content: [{ type: "text", text: `${bids.length}件見つかりました。` }],
          },
        });
        if (openEvidence) {
          setTimeout(() => {
            const details = frame.contentDocument?.querySelector(".evidence-panel details");
            if (details) details.open = true;
          }, 400);
        }
        if (selectBids) {
          setTimeout(() => {
            if (selectBids === "all") {
              const allBtn = frame.contentDocument?.querySelector(".selection-stats button");
              if (allBtn) {
                allBtn.click();
                window.bidsSelected = "all";
              }
            } else if (selectBids === "11_unordered") {
              // Select 11 distinct items in a specifically non-trivial sequence:
              // Index order: [10, 2, 6, 0, 8, 4, 1, 7, 3, 9, 5]
              const sequence = [10, 2, 6, 0, 8, 4, 1, 7, 3, 9, 5];
              const checkboxes = frame.contentDocument?.querySelectorAll(".bid-card input[type=checkbox]");
              window.selectedOrderRefs = [];
              window.selectedOrderKeys = [];
              if (checkboxes) {
                for (const idx of sequence) {
                  if (checkboxes[idx]) {
                    checkboxes[idx].click();
                    window.selectedOrderRefs.push(bids[idx].bidRef);
                    window.selectedOrderKeys.push(bids[idx].key);
                  }
                }
                window.bidsSelected = sequence;
              }
            } else {
              const indices = selectBids.split(",").map(Number);
              const checkboxes = frame.contentDocument?.querySelectorAll(".bid-card input[type=checkbox]");
              if (checkboxes) {
                for (const idx of indices) {
                  if (checkboxes[idx]) checkboxes[idx].click();
                }
                window.bidsSelected = indices;
              }
            }
          }, 400);
        }
        if (clickAction) {
          setTimeout(() => {
            const buttons = [
              ...(frame.contentDocument?.querySelectorAll(".action-dock button, .lane-selection-bar button, .lane-actions button") ?? [])
            ];
            const targetBtn = buttons.find((b) => b.textContent?.includes(clickAction));
            if (!targetBtn) {
              window.actionClickError = `Target button containing "${clickAction}" not found`;
              return;
            }
            targetBtn.click();
            window.actionClicked = true;
          }, selectBids ? 700 : 500);
        }
      }
      return;
    case "ui/open-link":
    case "ui/update-model-context":
      result(message.id, {});
      return;
    case "ui/download-file":
      window.lastDownloadFile = message.params?.contents;
      if (denyDownload) errorResult(message.id, "download declined");
      else result(message.id, {});
      return;
    case "ui/message":
      if (denyMessage) errorResult(message.id, "message declined");
      else result(message.id, {});
      return;
    case "ui/request-display-mode":
      hostContext.displayMode = message.params?.mode ?? hostContext.displayMode;
      result(message.id, { mode: hostContext.displayMode });
      send({
        jsonrpc: "2.0",
        method: "ui/notifications/host-context-changed",
        params: hostContext,
      });
      return;
    case "tools/call": {
      const toolName = message.params?.name;
      const toolArgs = message.params?.arguments || {};
      window.toolCalls = window.toolCalls || [];
      window.toolCalls.push({ name: toolName, arguments: toolArgs });

      if (toolName === "rank_bids") {
        const refs = Array.isArray(toolArgs.bid_refs) ? toolArgs.bid_refs : [];
        const unknownRef = refs.find((ref) => !bids.some((b) => b.bidRef === ref));
        if (unknownRef) {
          errorResult(message.id, `Unknown bid_ref: ${unknownRef}`);
          return;
        }

        const rankedBids = refs.map((ref, idx) => {
          const matchedBid = bids.find((b) => b.bidRef === ref);
          const score = 95 - (idx * 3);
          return {
            bid: matchedBid,
            score,
            priority: score >= 80 ? "pursue" : score >= 60 ? "review" : "skip",
            reasons: [`適合度スコア (${score}点) - 要件合致`],
            risks: [],
            nextActions: ["参加要件の確認", "質問書の提出検討"],
            selectionIndex: idx,
          };
        });

        const rankContent = {
          searchHits: refs.length,
          returnedCount: refs.length,
          rankedCount: rankedBids.length,
          rankedBids,
          query: { Query: "選択案件比較" },
          attribution,
          scoringPolicy: {
            version: "1.0",
            summary: "ルールベース適合度評価",
          },
        };

        window.lastToolCall = { name: toolName, arguments: toolArgs, response: rankContent };
        result(message.id, {
          content: [{ type: "text", text: `${rankedBids.length}件の案件を比較採点しました。` }],
          structuredContent: rankContent,
        });
        return;
      }

      if (toolName === "export_bid_shortlist") {
        const refs = Array.isArray(toolArgs.bid_refs) ? toolArgs.bid_refs : [];
        const unknownRef = refs.find((ref) => !bids.some((b) => b.bidRef === ref));
        if (unknownRef) {
          errorResult(message.id, `Unknown bid_ref: ${unknownRef}`);
          return;
        }

        const matched = refs.map((ref) => bids.find((b) => b.bidRef === ref));
        const format = toolArgs.format || "csv";
        const columns = [
          "key",
          "projectName",
          "organizationName",
          "prefectureName",
          "category",
          "procedureType",
          "cftIssueDate",
          "tenderSubmissionDeadline",
          "officialUrl",
        ];

        let exportContent;
        if (format === "json") {
          exportContent = {
            format: "json",
            filename: "jp-bids-export.json",
            rankedCount: matched.length,
            columns,
            jsonContent: matched.map((b) => ({
              key: b.key,
              projectName: b.projectName,
              organizationName: b.organizationName,
              prefectureName: b.prefectureName,
              category: b.category,
              procedureType: b.procedureType,
              cftIssueDate: b.cftIssueDate,
              tenderSubmissionDeadline: b.tenderSubmissionDeadline,
              officialUrl: b.officialUrl,
            })),
            attribution,
            scoringPolicy: {
              version: "1.0",
              summary: "ルールベース適合度評価",
            },
          };
        } else {
          const header = columns.join(",");
          const rows = matched.map((b) =>
            columns.map((c) => JSON.stringify(b[c] ?? "")).join(","),
          );
          exportContent = {
            format: "csv",
            filename: "jp-bids-export.csv",
            rankedCount: matched.length,
            columns,
            csv: [header, ...rows].join("\n"),
            attribution,
            scoringPolicy: {
              version: "1.0",
              summary: "ルールベース適合度評価",
            },
          };
        }

        window.lastToolCall = { name: toolName, arguments: toolArgs, response: exportContent };
        result(message.id, {
          content: [{ type: "text", text: `エクスポート完了: ${matched.length}件` }],
          structuredContent: exportContent,
        });
        return;
      }

      if (toolName === "search_bids_app" || toolName === "search_bids") {
        window.lastToolCall = { name: toolName, arguments: toolArgs, response: searchResult };
        result(message.id, {
          content: [{ type: "text", text: `${bids.length}件見つかりました。` }],
          structuredContent: searchResult,
        });
        return;
      }

      window.lastToolCall = { name: toolName, arguments: toolArgs };
      result(message.id, { content: [{ type: "text", text: "ok" }] });
      return;
    }
    default:
      if (message.id !== undefined) result(message.id, {});
  }
});
</script>
</body>
</html>
